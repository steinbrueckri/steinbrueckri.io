version: "3"

vars:
  HUGO_VERSION: "0.134.3"
  HUGO_PATH: ".tmp/hugo"
  B2_BIN_PATH: "$HOME/bin/b2"
  EXTERNAL_ASSETS_PATH: "./assets/external"
  FONTS_PATH: "./themes/steinbrueckri/static/fonts"
  # Roboto Mono (weight 400) self-hosted for GDPR compliance (no Google Fonts CDN).
  # Latin + latin-ext subsets cover German umlauts. Refresh with `task download-fonts --force`.
  FONT_URL_LATIN: "https://fonts.gstatic.com/s/robotomono/v31/L0xuDF4xlVMF-BfR8bXMIhJHg45mwgGEFl0_3vq_ROW4.woff2"
  FONT_URL_LATIN_EXT: "https://fonts.gstatic.com/s/robotomono/v31/L0xuDF4xlVMF-BfR8bXMIhJHg45mwgGEFl0_3vq_SuW4Ep0.woff2"
  OS: "{{OS}}"
  ARCH: "{{ARCH}}"

tasks:

  clean:
    desc: Clean build directory
    cmds:
      - rm -rfv .tmp public/**

  npm-install:
    desc: Install npm dependencies
    silent: true
    cmds:
      - |
        if [ ! -d "node_modules" ] || [ "package.json" -nt "node_modules" ]; then
          npm install
        else
          echo "npm dependencies are up to date"
        fi

  hugo-install:
    desc: Install Hugo
    silent: true
    cmds:
      - task: npm-install
      - |
        if [ ! -f "{{.HUGO_PATH}}" ]; then
          ./node_modules/hugo-installer/bin/hugo-installer.js --extended true --version {{.HUGO_VERSION}} --destination .tmp/
        else
          echo "Hugo already installed at {{.HUGO_PATH}}"
        fi

  hugo-build:
    desc: Build Hugo site (with native minification)
    cmds:
      - task: hugo-install
      - |
        {{.HUGO_PATH}} --minify || (echo "Hugo build failed!" && exit 1)

  install-b2:
    desc: Install Backblaze B2 CLI if not already installed
    silent: true
    cmds:
      - |
        if ! command -v b2 &> /dev/null; then
          # Prefer installing via Python pip (official B2 SDK provides the 'b2' CLI)
          if command -v python3 &> /dev/null; then
            python3 -m pip install --user --upgrade b2 || pip3 install --user --upgrade b2 || pip install --user --upgrade b2
            # Ensure ~/.local/bin is in PATH for GitHub Actions and typical Linux envs
            export PATH="$HOME/.local/bin:$PATH"
          else
            # Fallback to pip if python3 is not found
            pip install --user --upgrade b2
            export PATH="$HOME/.local/bin:$PATH"
          fi
          if ! command -v b2 &> /dev/null; then
            echo "b2 CLI installation via pip failed" && exit 1
          fi
          b2 version || (echo "b2 installation verification failed" && exit 1)
          b2 account authorize
        else
          echo "b2 is already installed."
        fi

  copy-baguettebox:
    desc: Copy BaguetteBox assets
    silent: true
    cmds:
      - mkdir -p {{.EXTERNAL_ASSETS_PATH}}
      - cp node_modules/baguettebox.js/dist/baguetteBox.min.* {{.EXTERNAL_ASSETS_PATH}}/

  copy-lazyload:
    desc: Copy LazyLoad assets
    silent: true
    cmds:
      - mkdir -p {{.EXTERNAL_ASSETS_PATH}}
      - cp node_modules/vanilla-lazyload/dist/lazyload.js {{.EXTERNAL_ASSETS_PATH}}/

  copy:
    desc: Copy external assets
    deps:
      - copy-lazyload
      - copy-baguettebox

  download-fonts:
    desc: Download self-hosted Roboto Mono web fonts (GDPR-compliant, no Google CDN)
    silent: true
    cmds:
      - mkdir -p {{.FONTS_PATH}}
      - |
        ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
        download() {
          # $1 = URL, $2 = target filename
          if [ -f "{{.FONTS_PATH}}/$2" ]; then
            echo "Font $2 already present, skipping (use 'rm {{.FONTS_PATH}}/$2' to refresh)"
            return 0
          fi
          echo "Downloading $2 ..."
          curl -fsSL -H "User-Agent: $ua" "$1" -o "{{.FONTS_PATH}}/$2" \
            || { echo "Failed to download $2"; exit 1; }
        }
        download "{{.FONT_URL_LATIN}}" "roboto-mono-latin-400.woff2"
        download "{{.FONT_URL_LATIN_EXT}}" "roboto-mono-latin-ext-400.woff2"

  new-gallery:
    desc: Create new gallery with current month/year (e.g., Street-12-2024)
    cmds:
      - hugo new --kind gallery gallery/Street-$(date +%m-%Y)

  new-blog:
    desc: Create new blog post with current date (e.g., 2024-12-15)
    cmds:
      - hugo new --kind blog blog/$(date +%Y-%m-%d)

  get-gallery-images:
    desc: Fetch gallery images from Backblaze B2 storage (requires 1Password CLI or env vars)
    cmds:
      - ./get_gallery_images.sh "content/gallery/**" "{{.B2_APPLICATION_KEY_ID}}" "{{.B2_APPLICATION_KEY}}"
    vars:
      B2_APPLICATION_KEY_ID:
        sh: "[[ -z $B2_APPLICATION_KEY_ID ]] && op --account pixel-combo.1password.com item get sysbnrxrvnlha5nicpxhpzxkru --fields keyID || echo ${B2_APPLICATION_KEY_ID}"
      B2_APPLICATION_KEY:
        sh: "[[ -z $B2_APPLICATION_KEY ]] && op --account pixel-combo.1password.com item get sysbnrxrvnlha5nicpxhpzxkru --reveal --fields applicationKey || echo $B2_APPLICATION_KEY"

  link-checker:
    desc: Check for broken links in site
    cmds:
      - |
        docker run --init -i --rm -w /input \
          -v "$PWD/.lychee.toml:/tmp/.lychee.toml" \
          -v "$PWD/public:/input" \
          lycheeverse/lychee:latest . -c /tmp/.lychee.toml

  build:
    desc: Build complete Hugo site (npm deps, assets, fonts, Hugo with native minify, link check)
    cmds:
      - task: npm-install
      - task: copy
      - task: download-fonts
      - task: hugo-build
      - task: link-checker

  ci:
    desc: Continuous Integration build (includes B2 setup and gallery images)
    cmds:
      - task: install-b2
      - task: get-gallery-images
      - task: build
