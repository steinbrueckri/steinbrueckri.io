version: "3"

vars:
  HUGO_VERSION: "0.165.0"
  HUGO_PATH: ".tmp/hugo"
  EXTERNAL_ASSETS_PATH: "./assets/external"
  FONTS_PATH: "./themes/steinbrueckri/static/fonts"
  # Roboto Mono (weight 400) self-hosted for GDPR compliance (no Google Fonts CDN).
  # Latin + latin-ext subsets cover German umlauts. Refresh with `task download-fonts --force`.
  FONT_URL_LATIN: "https://fonts.gstatic.com/s/robotomono/v31/L0xuDF4xlVMF-BfR8bXMIhJHg45mwgGEFl0_3vq_ROW4.woff2"
  FONT_URL_LATIN_EXT: "https://fonts.gstatic.com/s/robotomono/v31/L0xuDF4xlVMF-BfR8bXMIhJHg45mwgGEFl0_3vq_SuW4Ep0.woff2"
  OS: "{{OS}}"
  ARCH: "{{ARCH}}"

tasks:
  clean:
    desc: Clean build directory
    cmds:
      - rm -rfv .tmp public/**

  npm-install:
    desc: Install npm dependencies
    silent: true
    cmds:
      - |
        if [ ! -d "node_modules" ] || [ "package.json" -nt "node_modules" ]; then
          npm install
        else
          echo "npm dependencies are up to date"
        fi

  hugo-install:
    desc: Install Hugo
    silent: true
    cmds:
      - task: npm-install
      - |
        if [ ! -f "{{.HUGO_PATH}}" ]; then
          ./node_modules/hugo-installer/bin/hugo-installer.js --extended true --version {{.HUGO_VERSION}} --destination .tmp/
        else
          echo "Hugo already installed at {{.HUGO_PATH}}"
        fi

  hugo-build:
    desc: Build Hugo site
    cmds:
      - task: hugo-install
      - |
        {{.HUGO_PATH}} --minify || (echo "Hugo build failed!" && exit 1)

  hugo-serve:
    desc: Serve the site locally with a live-reloading dev server
    cmds:
      - task: hugo-install      # also runs npm-install
      - task: copy              # external assets needed by resources.Get
      - task: download-fonts
      - |
        {{.HUGO_PATH}} serve --minify || (echo "Hugo serve failed!" && exit 1)

  install-rclone:
    desc: "Ensure rclone is available (local via Homebrew, CI via official install script)"
    silent: true
    cmds:
      - |
        if command -v rclone &> /dev/null; then
          echo "rclone is already installed."
        elif command -v brew &> /dev/null; then
          echo "Installing rclone via Homebrew..."
          brew install rclone
        else
          # CI / Linux without Homebrew
          echo "Installing rclone via official script..."
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version || (echo "rclone installation verification failed" && exit 1)
        fi

  copy-baguettebox:
    desc: Copy BaguetteBox assets
    silent: true
    cmds:
      - mkdir -p {{.EXTERNAL_ASSETS_PATH}}
      - cp node_modules/baguettebox.js/dist/baguetteBox.min.* {{.EXTERNAL_ASSETS_PATH}}/

  copy-lazyload:
    desc: Copy LazyLoad assets
    silent: true
    cmds:
      - mkdir -p {{.EXTERNAL_ASSETS_PATH}}
      - cp node_modules/vanilla-lazyload/dist/lazyload.js {{.EXTERNAL_ASSETS_PATH}}/

  copy:
    desc: Copy external assets
    deps:
      - copy-lazyload
      - copy-baguettebox

  download-fonts:
    desc: Download self-hosted Roboto Mono web fonts (GDPR-compliant, no Google CDN)
    silent: true
    cmds:
      - mkdir -p {{.FONTS_PATH}}
      - |
        ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
        download() {
          # $1 = URL, $2 = target filename
          if [ -f "{{.FONTS_PATH}}/$2" ]; then
            echo "Font $2 already present, skipping (use 'rm {{.FONTS_PATH}}/$2' to refresh)"
            return 0
          fi
          echo "Downloading $2 ..."
          curl -fsSL -H "User-Agent: $ua" "$1" -o "{{.FONTS_PATH}}/$2" \
            || { echo "Failed to download $2"; exit 1; }
        }
        download "{{.FONT_URL_LATIN}}" "roboto-mono-latin-400.woff2"
        download "{{.FONT_URL_LATIN_EXT}}" "roboto-mono-latin-ext-400.woff2"

  new-gallery:
    desc: Create new gallery with current month/year (e.g., Street-12-2024)
    cmds:
      - hugo new --kind gallery gallery/Street-$(date +%m-%Y)

  new-blog:
    desc: Create new blog post with current date (e.g., 2024-12-15)
    cmds:
      - hugo new --kind blog blog/$(date +%Y-%m-%d)

  get-gallery-images:
    desc: Fetch gallery images from Hetzner Object Storage (requires 1Password CLI or env vars)
    cmds:
      - ./get_gallery_images.sh "content/gallery/**" "{{.HETZNER_S3_ACCESS_KEY}}" "{{.HETZNER_S3_SECRET_KEY}}"
    vars:
      HETZNER_S3_ACCESS_KEY:
        sh: '[[ -z $HETZNER_S3_ACCESS_KEY ]] && op --account pixel-combo.1password.com item get gvxtufmimnh2y576ehxdmcukwm --reveal --fields "Access Key" || echo ${HETZNER_S3_ACCESS_KEY}'
      HETZNER_S3_SECRET_KEY:
        sh: '[[ -z $HETZNER_S3_SECRET_KEY ]] && op --account pixel-combo.1password.com item get gvxtufmimnh2y576ehxdmcukwm --reveal --fields "Secret Key" || echo $HETZNER_S3_SECRET_KEY'

  lighthouse:
    desc: Run Lighthouse audits locally against a Hugo dev server (override URLs via LH_URLS)
    vars:
      LH_PORT: '{{.LH_PORT | default "1313"}}'
      # Pages that render without the fetched gallery images. Override e.g.:
      #   task lighthouse LH_URLS="/ /blog/ /gallery/street-01-2020/"
      LH_URLS: '{{.LH_URLS | default "/ /blog/ /gallery/"}}'
      LH_OUT: ".lighthouse"
    cmds:
      - task: hugo-install      # also runs npm-install (provides ./node_modules/.bin/lighthouse)
      - task: copy              # external assets needed by resources.Get
      - task: download-fonts
      - |
        set -e
        port="{{.LH_PORT}}"
        out="{{.LH_OUT}}"
        lh="./node_modules/.bin/lighthouse"

        if [ ! -x "$lh" ]; then
          echo "Lighthouse not found at $lh – run 'task npm-install' (or 'npm install')." && exit 1
        fi

        mkdir -p "$out"

        # Start a local Hugo dev server. It rewrites baseURL to localhost so the
        # absURL-based asset links resolve locally instead of to the prod domain.
        {{.HUGO_PATH}} server --port "$port" --bind 127.0.0.1 --disableFastRender >/dev/null 2>&1 &
        hugo_pid=$!
        # Clean up reliably: kill the captured PID and, as a fallback, any Hugo
        # server still bound to our port (Task's shell can background differently).
        cleanup() {
          kill "$hugo_pid" 2>/dev/null || true
          pkill -f "hugo server --port $port" 2>/dev/null || true
        }
        trap cleanup EXIT

        # Wait until the server accepts connections (no explicit sleep loop needed).
        if ! curl -sf --retry 30 --retry-delay 1 --retry-connrefused "http://127.0.0.1:$port/" >/dev/null; then
          echo "Hugo dev server did not come up on port $port" && exit 1
        fi

        status=0
        for path in {{.LH_URLS}}; do
          name=$(printf '%s' "$path" | sed 's#^/##; s#/$##; s#/#_#g')
          [ -z "$name" ] && name="home"
          echo "Auditing $path ..."
          "$lh" "http://127.0.0.1:$port$path" \
            --quiet \
            --chrome-flags="--headless=new" \
            --output=html \
            --output-path="$out/$name.html" \
            || { echo "Lighthouse audit failed for $path"; status=1; }
        done

        echo "Reports written to $out/ (open the .html files in a browser)."
        cleanup
        exit $status

  link-checker:
    desc: Check for broken links in site
    cmds:
      - |
        docker run --init -i --rm -w /input \
          -v "$PWD/.lychee.toml:/tmp/.lychee.toml" \
          -v "$PWD/public:/input" \
          lycheeverse/lychee:latest . -c /tmp/.lychee.toml

  build:
    desc: Build complete Hugo site (npm deps, assets, fonts, Hugo with native minify, link check)
    cmds:
      - task: npm-install
      - task: copy
      - task: download-fonts
      - task: hugo-build
      - task: link-checker

  ci:
    desc: Continuous Integration build (includes object storage setup and gallery images)
    cmds:
      - task: install-rclone
      - task: get-gallery-images
      - task: build
